```yaml
name: Deploy Flutter Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Instalar dependencias
      - name: Install dependencies
        run: flutter pub get

      # Analizar el proyecto
      - name: Analyze
        run: flutter analyze

      # Ejecutar pruebas
      - name: Run tests
        run: flutter test

      # Construir Flutter Web
      # CAMBIA "NOMBRE-DEL-REPOSITORIO"
      # por el nombre exacto de tu repositorio
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/bloc_notas/"

      # Preparar archivos para GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
